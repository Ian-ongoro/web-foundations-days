<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 4 - Note Pad & Counter</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>Note Pad</h1>
      <button id="theme-toggle" type="button">Toggle Theme</button>
    </header>

    <section class="editor-section">
      <label for="note-text">Your Note:</label>
      <textarea id="note-text" placeholder="Type your notes here..."></textarea>
    </section>

    <section class="stats-section">
      <p id="char-count">Character Count: 0</p>
      <p id="word-count">Word Count: 0</p>
    </section>

    <section class="actions-section">
      <button id="clear-btn" type="button">Clear Text</button>
    </section>
  </main>
</body>
</html>
