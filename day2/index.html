<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <nav class="navbar">
            <ul>
                <li class="note"><a href="index.html">Home</a></li>
                <li class="note"><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Hello, world</h1> 
        <p>My setup works</p>

        <section>
            <h2>Keyboard Shortcuts</h2>
            <table class="shortcuts-table">
                <thead>
                    <tr>
                        <th>Action</th>
                        <th>Shortcut</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Save Note</td>
                        <td><kbd>Ctrl</kbd> + <kbd>S</kbd></td>
                    </tr>
                    <tr>
                        <td>New Note</td>
                        <td><kbd>Ctrl</kbd> + <kbd>N</kbd></td>
                    </tr>
                    <tr>
                        <td>Clear Text</td>
                        <td><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>D</kbd></td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <h2>Send Feedback</h2>
            <form class="feedback-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Your name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Your email">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Your feedback..."></textarea>
                </div>
                <button type="submit" class="btn">Submit Feedback</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes App. All rights reserved.</p>
    </footer>
</body>
</html>
